<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Research projects by Davy Tao.">
  <title>Davy Tao · Research</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #17182c;
      background: #f7f7fb;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 80px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(2.5rem, 7vw, 4.5rem); letter-spacing: -.05em; }
    .intro { margin: 0 0 42px; color: #666a7d; font-size: 1.1rem; }
    .project {
      display: block;
      padding: 30px;
      color: inherit;
      background: #fff;
      border: 1px solid #e7e7f1;
      border-radius: 18px;
      text-decoration: none;
      box-shadow: 0 18px 45px rgba(29, 30, 62, .06);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .project:hover { transform: translateY(-3px); box-shadow: 0 22px 50px rgba(29, 30, 62, .1); }
    .project span { color: #6656e8; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .project h2 { margin: 12px 0 8px; font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1.2; }
    .project p { margin: 0; color: #666a7d; line-height: 1.65; }
  </style>
</head>
<body>
  <main>
    <h1>Research</h1>
    <p class="intro">Selected research projects by Davy Tao.</p>
    <a class="project" href="./skelmo/">
      <span>ECCV 2026</span>
      <h2>SkelMo</h2>
      <p>Universal Skeletal Motion Generation for 3D Rigged Shapes</p>
    </a>
  </main>
</body>
</html>
